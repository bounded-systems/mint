name: release

# THE SINGLE RELEASE ENTRY POINT. Two triggers, one file, on purpose (#48).
#
#   workflow_dispatch  the release, from the Actions UI — `cut` calls
#                      release-cut.yml to create the tag in CI, and the rest of
#                      the run chains off it. This is the path that means nobody
#                      needs `git push origin v0.3.0` from a laptop (#22, #39).
#   push: tags ["v*"]  a tag cut from a checkout by `mint release`.
#
# ############################################################################
# # WHY ONE FILE, AND WHY THIS FILENAME.                                     #
# ############################################################################
#
# npm's trusted publishing validates the ENTRY workflow's filename, not the file
# that contains `npm publish` — and a package may have exactly ONE trusted
# publisher configured. So every trigger that reaches npm has to live in one
# file, and that file's name is the value typed into npm's form. mint prescribes
# `release.yml` org-wide; see docs/npm-trusted-publishing.md and the header of
# .github/workflows/npm-publish.yml.
#
# This is why `cut.yml` no longer exists: it was a second dispatchable entry
# point that reached npm through this workflow, so npm validated `cut.yml` for a
# dispatched release and `release.yml` for a tag push. One publisher slot cannot
# cover both, and the failure only shows up as ENEEDAUTH after the tag is cut.
#
# ############################################################################
# # A TAG PUSHED BY CI TRIGGERS NOTHING — THE WORK MUST BE CHAINED.          #
# ############################################################################
#
# GitHub creates no workflow runs from events caused by GITHUB_TOKEN. The
# `push: tags` trigger above will NOT fire for the tag `cut` pushes, so every
# downstream job depends on `cut` rather than waiting to be triggered by it.
# `resolve` is what joins the two paths into one tag.
#
# DRY RUN DEFAULTS TO TRUE. A registry publish is irreversible — JSR versions are
# immutable — so verifying is the default and releasing is the explicit act.
# Dispatch once to watch every guard pass, then again with dry-run unchecked.
#
# What this workflow covers: the GitHub release (SLSA + cosign attestations),
# npm and JSR. Out of scope, triggered separately on the same tag:
#   Nix flakes    — flake consumers pin a sha; update PRs come from the
#                   flake-update bot when the tag lands on the default branch.
#   GHCR images   — OCI builds run in their own repo/workflow and reference the
#                   published npm tarball or the GitHub release asset.
#   Other deploys — bounded-systems infra workflows consume the GH release event.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      expect-version:
        description: "Version you expect to cut (e.g. 0.8.0). Fails if the manifest disagrees."
        type: string
        required: false
      dry-run:
        description: "Verify only — run every guard and cut nothing."
        type: boolean
        default: true
      recover-tag:
        description: "RECOVERY: re-publish this existing tag (e.g. v0.8.0). Skips the cut and the GitHub release."
        type: string
        required: false

permissions:
  contents: read

jobs:
  # The CI cut. Skipped entirely on the tag-push path, where the tag already
  # exists and was created from a checkout.
  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.recover-tag == ''
    permissions:
      contents: write # create + push the tag
    uses: ./.github/workflows/release-cut.yml
    with:
      # Self-hosted call: run the mint runtime from the commit being released.
      ref: ${{ github.sha }}
      expect-version: ${{ inputs.expect-version }}
      dry-run: ${{ inputs.dry-run }}

  # ONE tag for both paths, resolved once, so no job downstream has to know how
  # this run started. `!cancelled()` rather than `always()`: `cut` is SKIPPED on
  # the tag-push path, and a `needs:` on a skipped job would skip this too — but
  # a cancelled run must still stop here.
  #
  # The condition is also the dry-run gate. `cut` outputs `cut: 'false'` for a
  # dry run and nothing at all when it failed, so both leave this job skipped and
  # every publish below with it.
  resolve:
    needs: [cut]
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.recover-tag != '' || needs.cut.outputs.cut == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          RECOVER: ${{ inputs.recover-tag }}
          CUT_TAG: ${{ needs.cut.outputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # On a dispatch, $REF is the BRANCH — using it would test, pack, attest
          # and publish main under a version tag's name. The cut tag wins, and
          # the v-shape check below is what stops a branch name reaching a job.
          tag="${RECOVER:-${CUT_TAG:-$REF}}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a v<version> tag — refusing to release a branch"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag"

  release:
    needs: resolve
    # Skipped on the recovery door: that tag's GitHub release, attestation and
    # signed Statement already landed, and a published release is IMMUTABLE — the
    # upload would 422 for work that had in fact succeeded (#19). Recovery is for
    # the registries, which are the half that fails on its own.
    # A STATUS FUNCTION IS MANDATORY ON EVERY JOB DOWNSTREAM OF `cut`.
    #
    # GitHub propagates a skip through the entire `needs` CLOSURE, not one hop:
    # `cut` is SKIPPED on the tag-push and recovery doors, and every job that
    # transitively needs it is skipped too — unless that job ITSELF calls a
    # status function. `resolve`'s `!cancelled()` clears the taint for `resolve`
    # and nothing else, and a plain condition clears it not at all.
    #
    # Shipped broken: site-mcp's v0.3.0 recovery resolved the tag, skipped every
    # job beneath it and reported SUCCESS having published nothing. A dry run
    # cannot tell that apart from correct behaviour, because a dry run skips
    # those same jobs on purpose.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && inputs.recover-tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC — SLSA attestation + cosign keyless signing
      attestations: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Pack the package
        id: pack
        run: echo "tgz=$(npm pack | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tgz }}
      # Release provenance: the deterministic in-toto Statement binding this tag to
      # its version plan + commit. `mint attest` reproduces byte-for-byte what
      # `mint release` wrote locally, now with the CI builder identity filled in.
      - name: Emit the in-toto release Statement
        run: node mint.mjs attest --out mint-release.intoto.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.7.0
      # Keyless: no key material — the signature is bound to this workflow's OIDC
      # identity via Fulcio + logged in Rekor. The self-contained --bundle is the
      # same artifact @bounded-systems/verify consumes (cosign verify-blob).
      - name: Keyless-sign the release Statement (cosign, OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes --bundle mint-release.intoto.sigstore.json mint-release.intoto.json
      - name: Publish GitHub release (notes from the tag annotation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-from-tag \
            "${{ steps.pack.outputs.tgz }}" \
            mint-release.intoto.json \
            mint-release.intoto.sigstore.json

  # ---------------------------------------------------------------------------
  # Registry publishes. Both are gated by the `npm-publish` GitHub Environment
  # (required reviewer) — a maintainer approves once in the Actions UI and both
  # jobs unblock. The gate lives ON these jobs rather than on a no-op `approve`
  # job so that the OIDC token they present actually CARRIES the `environment`
  # claim; that claim is what npm's trusted-publisher Environment field pins, and
  # without it the pin cannot be set. A gate a registry can verify beats a gate
  # that is only job ordering.
  # ---------------------------------------------------------------------------
  npm:
    needs: [release, resolve]
    # `release` is SKIPPED on the recovery door, and a plain `needs:` would skip
    # this with it — which would make the recovery door publish nothing at all.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      environment: npm-publish

  jsr:
    needs: [release, resolve]
    # `release` is SKIPPED on the recovery door, and a plain `needs:` would skip
    # this with it — which would make the recovery door publish nothing at all.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # tokenless OIDC publish to JSR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      # JSR versions are IMMUTABLE, so this idempotence is load-bearing rather
      # than tidy: a recovery dispatch must not go red on the one registry that
      # already succeeded (site-mcp#38).
      - name: Already on JSR?
        id: on-jsr
        run: |
          set -euo pipefail
          pkg=$(jq -r .name jsr.json)
          version=$(jq -r .version jsr.json)
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://jsr.io/${pkg}/${version}_meta.json")
          if [ "$code" = "200" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::JSR already has $pkg@$version — skipping the publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JSR (OIDC — no token)
        if: steps.on-jsr.outputs.skip != 'true'
        run: npx --yes jsr publish --allow-slow-types
